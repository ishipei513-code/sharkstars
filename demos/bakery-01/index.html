<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小麦の丘 | ベーカリー</title>
  <meta name="description" content="焼きたてパンの香り">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header"><div class="container"><div class="logo"><i data-lucide="croissant"></i> 小麦の丘</div></div></header>
    <section class="hero bk-hero">
      <div class="container">
        <div class="bk-box fade">
          <h1>焼きたての香りが、<br>幸せを運ぶ。</h1>
          <p>天然酵母と国産小麦で<br>毎日丁寧に焼き上げています。</p>
        </div>
      </div>
    </section>
    <section class="section bk-sect">
      <div class="container fade">
        <h2>人気のパン</h2>
        <div class="bk-grid">
          <div class="item">
            <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80">
            <h3>カンパーニュ</h3>
          </div>
          <div class="item">
            <img src="https://images.unsplash.com/photo-1495147466023-ac5c588e2e40?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80">
            <h3>クロワッサン</h3>
          </div>
        </div>
      </div>
    </section>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
