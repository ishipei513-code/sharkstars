<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Amber | 琥珀色の時間</title>
  <meta name="description" content="厳選ウイスキーとカクテル">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header" id="header"><div class="container"><div class="logo">AMBER</div></div></header>
    <section class="hero b-hero">
      <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')"></div>
      <div class="content fade">
        <h1>Night whisper.</h1>
        <p>静寂と、琥珀色のひとときをあなたに。</p>
      </div>
    </section>
    <section class="section menu dark">
      <div class="container fade">
        <h2 class="sect-title">Menu</h2>
        <div class="d-grid">
          <div class="box">
            <i data-lucide="glass-water"></i>
            <h3>Whisky</h3>
            <p>200銘柄を超えるスコッチとバーボンのコレクション。幻の一杯をご提案します。</p>
          </div>
          <div class="box">
            <i data-lucide="martini"></i>
            <h3>Cocktail</h3>
            <p>旬のフルーツとハーブを使用した、バーテンダーのシグネチャーカクテル。</p>
          </div>
        </div>
      </div>
    </section>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
