<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>ピカピカハウスクリーニング | プロの清掃</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">ピカピカサービス</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>プロの技術で、<br>お家をピカピカに。</h1>
      <p>エアコン・レンジフード・水回り。<br>頑固な汚れもプロにお任せ。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>プロの技術</h3><p>専用洗剤と機材で市販品では落ちない汚れも。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>素材を傷めない</h3><p>建材に合わせた最適な洗浄。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>作業前後写真</h3><p>ビフォーアフター写真をお渡し。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>壁掛けエアコン</h4><div class="price">¥9,900</div></div>
        
          <div class="p-card"><h4>お掃除機能付き</h4><div class="price">¥15,400</div></div>
        
          <div class="p-card"><h4>天井埋込型</h4><div class="price">¥22,000</div></div>
        
          <div class="p-card"><h4>浴室</h4><div class="price">¥16,500</div></div>
        
          <div class="p-card"><h4>キッチン・換気扇</h4><div class="price">¥16,500</div></div>
        
          <div class="p-card"><h4>トイレ</h4><div class="price">¥8,800</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">ピカピカサービス</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
