<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'etoile | モダンフレンチ</title>
  <meta name="description" content="旬の食材を活かしたフレンチ">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header" id="header"><div class="container"><div class="logo">L'etoile</div></header>
    <section class="hero f-hero">
      <div class="f-img fade"><img src="https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
      <div class="f-box fade">
        <p class="subtitle">Modern French Cuisine</p>
        <h1>星降る夜の、<br>特別なひとときを。</h1>
      </div>
    </section>
    <section class="section">
      <div class="container flex">
        <div class="text fade">
          <h2>Philosophy</h2>
          <p>全国の生産者から届く最高の食材を、パリ三ツ星で培った技術で昇華。<br>洗練された空間で、記憶に残る美食体験をご提供します。</p>
        </div>
        <div class="img fade"><img src="https://images.unsplash.com/photo-1600891964092-4316c288032e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"></div>
      </div>
    </section>
    <footer class="footer">Restaurant L'etoile</footer>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
