<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>エコスマイル | 不用品回収・遺品整理</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">️ エコスマイル</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>不用品、<br>まるごとスッキリ。</h1>
      <p>家具・家電・粗大ゴミ。<br>電話1本で即日回収。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>即日対応OK</h3><p>当日に回収可能。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>業界最安値</h3><p>他社見積もりより安くします。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>買取対応</h3><p>使えるものは買取で値引き。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>軽トラック1台分</h4><div class="price">¥14,800〜</div></div>
        
          <div class="p-card"><h4>2tトラック</h4><div class="price">¥34,800〜</div></div>
        
          <div class="p-card"><h4>4tトラック</h4><div class="price">¥74,800〜</div></div>
        
          <div class="p-card"><h4>遺品整理（1K）</h4><div class="price">¥35,000〜</div></div>
        
          <div class="p-card"><h4>ゴミ屋敷清掃</h4><div class="price">要見積</div></div>
        
          <div class="p-card"><h4>法人片付け</h4><div class="price">要見積</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">️ エコスマイル</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
