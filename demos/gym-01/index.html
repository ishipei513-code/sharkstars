<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>BLAZE GYM | パーソナルトレーニング</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">BLAZE GYM</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>限界を超えろ。<br>理想の自分へ。</h1>
      <p>完全個室・マンツーマン指導で<br>ダイエット＆ボディメイクを実現。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>マンツーマン指導</h3><p>専属トレーナーが最後までサポート。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>食事指導つき</h3><p>LINEで毎日食事アドバイス。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>完全個室</h3><p>他の目を気にせずトレーニング。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>月4回コース</h4><div class="price">¥29,800</div></div>
        
          <div class="p-card"><h4>月8回コース</h4><div class="price">¥52,800</div></div>
        
          <div class="p-card"><h4>通い放題</h4><div class="price">¥79,800</div></div>
        
          <div class="p-card"><h4>無料カウンセリング</h4><div class="price">¥0</div></div>
        
          <div class="p-card"><h4>体験トレーニング</h4><div class="price">¥3,300</div></div>
        
          <div class="p-card"><h4>入会金</h4><div class="price">¥33,000</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">BLAZE GYM</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
