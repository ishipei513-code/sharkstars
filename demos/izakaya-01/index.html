<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>居酒屋 月夜 | 創作和食</title>
  <meta name="description" content="くつろぎの和空間">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header"><div class="container">居酒屋 月夜</div></header>
    <section class="hero i-hero">
      <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1542385151-efd24d9c7e0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')"></div>
      <div class="content fade">
        <h1>今宵も、月が綺麗ですね。</h1>
      </div>
    </section>
    <section class="section">
      <div class="container grid fade">
        <div class="box"><i data-lucide="beer"></i><br>厳選地酒</div>
        <div class="box"><i data-lucide="fish"></i><br>旬の鮮魚</div>
        <div class="box"><i data-lucide="moon"></i><br>完全個室</div>
      </div>
    </section>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
