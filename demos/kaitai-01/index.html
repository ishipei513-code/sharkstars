<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>誠和解体工業 | 安全・丁寧な解体工事</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">️ 誠和解体</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>建物解体は<br>安全・丁寧の誠和へ。</h1>
      <p>木造・鉄骨・RC造。<br>近隣対策を万全にした丁寧な解体工事。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>全構造対応</h3><p>木造からRC造まで解体実績多数。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>近隣対策万全</h3><p>防音シート・散水で粉塵最小限。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>産廃処理込み</h3><p>廃棄物は自社で適正処理。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>木造解体（坪）</h4><div class="price">¥25,000〜</div></div>
        
          <div class="p-card"><h4>鉄骨解体（坪）</h4><div class="price">¥35,000〜</div></div>
        
          <div class="p-card"><h4>RC造解体（坪）</h4><div class="price">¥45,000〜</div></div>
        
          <div class="p-card"><h4>アスベスト調査</h4><div class="price">¥33,000〜</div></div>
        
          <div class="p-card"><h4>外構撤去</h4><div class="price">要見積</div></div>
        
          <div class="p-card"><h4>整地</h4><div class="price">要見積</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">️ 誠和解体</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
