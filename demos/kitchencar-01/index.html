<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUNNY TACO | キッチンカー</title>
  <meta name="description" content="本格メキシカンタコス">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header"><div class="container"><div class="logo">🌮 SUNNY TACO</div></div></header>
    <section class="hero k-hero">
      <div class="split left fade">
        <h1>HAPPY<br>TACOS!</h1>
        <p>最高にハッピーなメキシカンタコスを、あなたの街にお届けします！</p>
        <a class="btn" href="#">Find Us! <i data-lucide="map-pin"></i></a>
      </div>
      <div class="split right" style="background-image:url('https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80')"></div>
    </section>
    <section class="section k-menu">
      <div class="container fade">
        <h2 class="title">HOT MENU!</h2>
        <div class="k-grid">
          <div class="k-card"><div class="icon"><i data-lucide="pizza"></i></div><h3>カルネアサダ</h3><p>特製スパイスのビーフ盛りだくさん！</p></div>
          <div class="k-card"><div class="icon"><i data-lucide="flame"></i></div><h3>チキンティンガ</h3><p>スモーキーでピリ辛なやみつきチキン！</p></div>
          <div class="k-card"><div class="icon"><i data-lucide="party-popper"></i></div><h3>ナチョス</h3><p>とろーりチーズとアボカドの最強コンビ！</p></div>
        </div>
      </div>
    </section>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
