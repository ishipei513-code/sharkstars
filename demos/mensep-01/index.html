<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>MEN'S CLEAR | メンズ脱毛サロン</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">MEN'S CLEAR</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>清潔感は、<br>ビジネスの武器。</h1>
      <p>最新SHR方式で痛みの少ない<br>メンズ脱毛を提供。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>最新SHR方式</h3><p>従来の10分の1の痛み。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>男性専門</h3><p>男性スタッフ対応。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>明朗会計</h3><p>追加料金なし。都度払いOK。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>ヒゲ全体（1回）</h4><div class="price">¥9,800</div></div>
        
          <div class="p-card"><h4>ヒゲ3部位</h4><div class="price">¥5,800</div></div>
        
          <div class="p-card"><h4>ヒゲし放題（6ヶ月）</h4><div class="price">¥59,800</div></div>
        
          <div class="p-card"><h4>全身（1回）</h4><div class="price">¥29,800</div></div>
        
          <div class="p-card"><h4>腕+脚</h4><div class="price">¥14,800</div></div>
        
          <div class="p-card"><h4>VIO</h4><div class="price">¥12,800</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">MEN'S CLEAR</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
