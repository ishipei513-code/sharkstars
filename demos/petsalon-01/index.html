<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>PawPaw ペットサロン | 大切な家族をキレイに</title><meta name="description" content="トリミング・シャンプー・歯磨き。送迎あり。">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">PawPaw</div></div></header>
  <section class="hero">
    <div class="hero-img"><img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="hero-box reveal">
      <h1>大切な家族を、<br>もっとキレイに。</h1>
      <p>ワンちゃんに優しい<br>丁寧なトリミング。</p>
    </div>
  </section>
  <section class="about section">
    <div class="container grid">
      <div class="text reveal">
        <span class="sub">Philosophy</span>
        <h2>美しさを引き出す、<br>上質な時間。</h2>
        <p>トリミング・シャンプー・歯磨き。送迎あり。</p>
        <div class="feat-list">
          <div class="feat"><h3><i data-lucide="check"></i> 低刺激シャンプー</h3><p>オーガニックシャンプー使用。</p></div><div class="feat"><h3><i data-lucide="check"></i> 送迎あり</h3><p>ご自宅までお迎え・お届け。</p></div><div class="feat"><h3><i data-lucide="check"></i> 仕上がり写真</h3><p>かわいい写真をプレゼント。</p></div>
        </div>
      </div>
      <div class="img reveal"><img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"></div>
    </div>
  </section>
  <section class="menu section">
    <div class="container reveal">
      <h2 class="center">Menu & Price</h2>
      <div class="price-box">
        
          <div class="row"><div class="name">シャンプーコース</div><div class="dots"></div><div class="cost">¥4,400〜</div></div>
        
          <div class="row"><div class="name">カット+シャンプー</div><div class="dots"></div><div class="cost">¥6,600〜</div></div>
        
          <div class="row"><div class="name">シャンプーコース</div><div class="dots"></div><div class="cost">¥5,500〜</div></div>
        
          <div class="row"><div class="name">カット+シャンプー</div><div class="dots"></div><div class="cost">¥8,800〜</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">PawPaw</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
