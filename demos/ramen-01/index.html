<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麺屋 龍星 | 本格豚骨ラーメン</title>
  <meta name="description" content="18時間煮込んだ濃厚スープ">
  <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header" id="header"><div class="container"><div class="logo">麺屋 龍星</div><div class="nav-list"><a href="#menu">御品書</a><a href="#about">こだわり</a></div></div></header>
    <section class="hero ramen-hero" style="background-image:url('https://images.unsplash.com/photo-1552611052-33e04de081de?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')">
      <div class="overlay"></div>
      <div class="container">
        <div class="hero-content fade">
          <p class="tag">魂の一杯</p>
          <h1>限界突破。<br>十八時間煮込みスープ。</h1>
          <a href="#menu" class="btn">御品書を見る <i data-lucide="arrow-right"></i></a>
        </div>
      </div>
    </section>
    <section class="section about" id="about">
      <div class="container grids">
        <div class="text fade">
          <h2>圧倒的な<br>旨さの秘密。</h2>
          <p>豚の頭骨を18時間休むことなく煮込み続けることで生まれる、究極の白濁スープ。毎朝職人が打つ自家製極細麺との相性はまさに奇跡の領域。</p>
        </div>
        <div class="imgbox fade"><img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="ramen bowl"></div>
      </div>
    </section>
    <section class="section menu" id="menu">
      <div class="container fade">
        <h2 class="center">御品書</h2>
        <div class="menu-list">
          <div class="item"><span>豚骨ラーメン</span><span>850円</span></div>
          <div class="item"><span>特製全部のせ</span><span>1,180円</span></div>
          <div class="item"><span>辛味噌とんこつ</span><span>950円</span></div>
          <div class="item"><span>自家製手包み餃子</span><span>380円</span></div>
        </div>
      </div>
    </section>
    <footer class="footer"><div class="container">麺屋 龍星 - RYUSEI -</div></footer>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
