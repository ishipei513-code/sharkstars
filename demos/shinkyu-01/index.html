<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>鍼灸院 和 | 東洋医学で体を整える</title><meta name="description" content="はり・きゅうで自律神経を整え自然治癒力を高めます。">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">鍼灸院 和</div></div></header>
  <section class="hero">
    <div class="hero-img"><img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="hero-box reveal">
      <h1>東洋医学の知恵で、<br>心身を整える。</h1>
      <p>はり・きゅう・漢方で<br>自然治癒力を高めます。</p>
    </div>
  </section>
  <section class="about section">
    <div class="container grid">
      <div class="text reveal">
        <span class="sub">Philosophy</span>
        <h2>美しさを引き出す、<br>上質な時間。</h2>
        <p>はり・きゅうで自律神経を整え自然治癒力を高めます。</p>
        <div class="feat-list">
          <div class="feat"><h3><i data-lucide="check"></i> 伝統の鍼灸</h3><p>2000年の歴史を持つ東洋医学。</p></div><div class="feat"><h3><i data-lucide="check"></i> 痛くない鍼</h3><p>髪の毛ほどの極細鍼。</p></div><div class="feat"><h3><i data-lucide="check"></i> 体質改善</h3><p>冷え性・不眠に効果的。</p></div>
        </div>
      </div>
      <div class="img reveal"><img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"></div>
    </div>
  </section>
  <section class="menu section">
    <div class="container reveal">
      <h2 class="center">Menu & Price</h2>
      <div class="price-box">
        
          <div class="row"><div class="name">全身調整（60分）</div><div class="dots"></div><div class="cost">¥6,600</div></div>

          <div class="row"><div class="name">温灸コース（40分）</div><div class="dots"></div><div class="cost">¥4,950</div></div>
        
          <div class="row"><div class="name">逆子のお灸</div><div class="dots"></div><div class="cost">¥3,300</div></div>
        
          <div class="row"><div class="name">セルフケア指導</div><div class="dots"></div><div class="cost">¥2,200</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">鍼灸院 和</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
