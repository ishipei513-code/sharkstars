<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>FC VERDE サッカースクール</title><meta name="description" content="幼児〜中学生。元Jリーガーコーチ在籍。">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo"><i data-lucide="shield-check"></i> FC VERDE</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="overlay"></div>
    <div class="container hero-content reveal">
      <h1>楽しく、強く。<br>サッカーで成長。</h1>
      <p>元Jリーガーコーチが<br>サッカーの楽しさと技術を伝えます。</p>
      <div class="stats"><div class="stat"><span>実績</span><strong>15年</strong></div><div class="stat"><span>満足度</span><strong>98%</strong></div></div>
    </div>
  </div>
  <section class="section">
    <div class="container">
      <h2 class="sect-title reveal">OUR STRENGTH</h2>
      <div class="bento-grid">
        <div class="bento-item reveal" style="transition-delay:0s">
          <div class="icon"><i data-lucide="check-circle"></i></div>
          <h3>元Jリーガー指導</h3><p>プロの経験を活かした指導。</p>
        </div><div class="bento-item reveal" style="transition-delay:0.1s">
          <div class="icon"><i data-lucide="check-circle"></i></div>
          <h3>年齢別クラス</h3><p>幼児・小学・中学。</p>
        </div><div class="bento-item reveal" style="transition-delay:0.2s">
          <div class="icon"><i data-lucide="check-circle"></i></div>
          <h3>挨拶と礼儀</h3><p>サッカーで人間力も育む。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section gray">
    <div class="container reveal">
      <h2 class="sect-title">SERVICES</h2>
      <div class="service-table">
        <div class="s-row"><div class="s-name">幼児（週1回/50分）</div><div class="s-cost">¥5,500/月</div></div><div class="s-row"><div class="s-name">小学生（週2回/80分）</div><div class="s-cost">¥8,800/月</div></div><div class="s-row"><div class="s-name">中学生（週3回/90分）</div><div class="s-cost">¥11,000/月</div></div><div class="s-row"><div class="s-name">体験レッスン</div><div class="s-cost">¥0</div></div>
      </div>
    </div>
  </section>
  <footer class="footer">FC VERDE</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
