<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>アクア水道サービス | 最短30分で到着</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
</head>
<body>
  <header class="header" id="header"><div class="container"><div class="logo">アクア水道</div></div></header>
  <div class="hero">
    <div class="bg"><img src="https://images.unsplash.com/photo-1542361345-89e58247f2d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80"></div>
    <div class="clip-mask"></div>
    <div class="hero-content reveal">
      <h1>水のトラブル、<br>即解決します。</h1>
      <p>水漏れ・つまり・トイレ修理。<br>24時間365日受付。</p>
    </div>
  </div>
  <section class="section bg-dark">
    <div class="container">
      <h2 class="title reveal">FEATURES</h2>
      <div class="card-wrap">
        <div class="card reveal" style="transition-delay:0s">
          <i data-lucide="zap"></i><h3>最短30分到着</h3><p>エリア内なら30分で駆けつけ。</p>
        </div><div class="card reveal" style="transition-delay:0.1s">
          <i data-lucide="zap"></i><h3>見積もり無料</h3><p>出張費・見積もり0円。</p>
        </div><div class="card reveal" style="transition-delay:0.2s">
          <i data-lucide="zap"></i><h3>実績5,000件</h3><p>年間5,000件以上の施工実績。</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section menu">
    <div class="container reveal">
      <h2 class="title title-dark">SYSTEM & PLANS</h2>
      <div class="plans">
        
          <div class="p-card"><h4>蛇口水漏れ</h4><div class="price">¥4,400〜</div></div>
        
          <div class="p-card"><h4>トイレつまり</h4><div class="price">¥5,500〜</div></div>
        
          <div class="p-card"><h4>排水管洗浄</h4><div class="price">¥8,800〜</div></div>
        
          <div class="p-card"><h4>蛇口交換</h4><div class="price">¥12,000〜</div></div>
        
          <div class="p-card"><h4>トイレ交換</h4><div class="price">¥55,000〜</div></div>
        
          <div class="p-card"><h4>給湯器交換</h4><div class="price">¥88,000〜</div></div>
        
      </div>
    </div>
  </section>
  <footer class="footer">アクア水道</footer>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  window.addEventListener('scroll', () => { document.getElementById('header')?.classList.toggle('scrolled', window.scrollY > 50); });
  const obs = new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting) { i.target.classList.add('visible'); } }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
