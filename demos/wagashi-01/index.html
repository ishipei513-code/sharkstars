<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和菓子 花月 | 四季の彩り</title>
  <meta name="description" content="美しい上生菓子">
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header"><div class="container">花月</div></header>
    <section class="hero w-hero">
      <div class="container flex">
        <div class="txt fade"><h1>四季を彩る<br>和の心。</h1></div>
        <div class="img fade"><img src="https://images.unsplash.com/photo-1627997786483-3eb8eeda9fdc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"></div>
      </div>
    </section>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
