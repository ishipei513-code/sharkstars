<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焼肉 炎 | 極上和牛空間</title>
  <meta name="description" content="厳選されたA5ランク和牛">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assist/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header" id="header"><div class="container"><div class="logo">HOMURA</div></div></header>
    <section class="hero y-hero">
      <div class="y-bg" style="background-image:url('https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')"></div>
      <div class="overlay"></div>
      <div class="hero-content fade">
        <p class="en">Premium Wagyu</p>
        <h1>炎が引き出す、肉の芸術。</h1>
      </div>
    </section>
    <section class="section y-about" id="about">
      <div class="container y-grid">
        <div class="img fade"><img src="https://images.unsplash.com/photo-1544025162-811114cd6138?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="meat"></div>
        <div class="txt fade">
          <p class="en">Commitment</p>
          <h2>A5黒毛和牛の<br>至高の味わいを個室で</h2>
          <p>全国から選び抜いた最高級の黒毛和牛を一頭買い。<br>一切の妥協を許さないプロの目利きでお届けします。</p>
          <div class="stats">
            <div><i data-lucide="award"></i><span>A5ランク</span></div>
            <div><i data-lucide="wine"></i><span>完全個室</span></div>
          </div>
        </div>
      </div>
    </section>
    <section class="section y-menu">
      <div class="container fade">
        <h2 class="center">Menu</h2>
        <div class="cards">
          <div class="card"><i data-lucide="flame"></i><h3>極コース</h3><p>和牛シャトーブリアンを含む最高級フルコース。<br>12,000円</p></div>
          <div class="card"><i data-lucide="sparkles"></i><h3>匠コース</h3><p>希少部位を堪能できる当店一番人気のコース。<br>8,800円</p></div>
        </div>
      </div>
    </section>
    <footer class="footer"><div class="container">Yakiniku HOMURA</div></footer>
    
  <script>
    lucide.createIcons();
    // Header scroll
    window.addEventListener('scroll', () => {
      const h = document.getElementById('header');
      if(h) h.classList.toggle('scrolled', window.scrollY > 50);
    });
    // Fade in
    const obs = new IntersectionObserver(e => {
      e.forEach(i => { if(i.isIntersecting) { i.target.style.opacity=1; i.target.style.transform='translateY(0) scale(1)'; }});
    }, {threshold: 0.1});
    document.querySelectorAll('.fade').forEach(el => {
      el.style.opacity = 0; el.style.transform = 'translateY(20px)'; el.style.transition = 'all 0.8s ease';
      obs.observe(el);
    });
  </script>
</body>
</html>
