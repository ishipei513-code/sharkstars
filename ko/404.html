<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 페이지를 찾을 수 없습니다 / ページが見つかりません | KOJP</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="페이지를 찾을 수 없습니다 / ページが見つかりません — KOJP">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard-jp/dist/web/static/pretendard-jp.min.css">

  <link rel="icon" type="image/svg+xml" href="/ko/assets/img/favicons/favicon.svg">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <link rel="stylesheet" href="/ko/assets/css/main.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(245, 220, 200, 0.35), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(168, 197, 214, 0.22), transparent 50%),
        var(--color-base);
    }
    .error-page__inner {
      max-width: 520px;
      margin: 0 auto;
    }
    .error-page__code {
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 600;
      color: var(--color-accent-primary);
      line-height: 0.9;
      margin-bottom: var(--space-md);
      letter-spacing: -0.05em;
      opacity: 0.85;
    }
    .error-page__title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: var(--space-sm);
    }
    .error-page__title-sub {
      font-size: 1.0625rem;
      color: var(--color-text-sub);
      margin-bottom: var(--space-md);
      font-weight: var(--font-weight-regular);
    }
    .error-page__text {
      font-size: 1rem;
      color: var(--color-text-sub);
      max-width: 420px;
      margin: 0 auto var(--space-xl);
      line-height: 1.7;
    }
    .error-page__text > span {
      display: block;
    }
    .error-page__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: center;
      margin-bottom: var(--space-xl);
    }
    .error-page__lang-switch {
      font-size: var(--font-size-small);
      color: var(--color-text-light);
      display: inline-flex;
      gap: var(--space-md);
      align-items: center;
    }
    .error-page__lang-switch a {
      color: var(--color-text-sub);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .error-page__lang-switch a:hover {
      color: var(--color-accent-primary);
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">본문으로 건너뛰기</a>

  <main id="main-content" class="error-page">
    <div class="error-page__inner">
      <p class="error-page__code" aria-hidden="true">404</p>
      <h1 class="error-page__title">페이지를 찾을 수 없습니다</h1>
      <p class="error-page__title-sub">ページが見つかりません</p>
      <p class="error-page__text">
        <span>찾으시는 페이지가 이동되었거나 삭제되었을 가능성이 있습니다.</span>
        <span>お探しのページは移動または削除された可能性があります。</span>
      </p>
      <div class="error-page__actions">
        <a href="/ko/" class="btn btn--primary">홈으로 / トップへ</a>
        <a href="/ko/contact/" class="btn btn--secondary">문의하기 / お問い合わせ</a>
      </div>
      <p class="error-page__lang-switch">
        <a href="/ko/">한국어</a>
        <span aria-hidden="true">|</span>
        <a href="/ko/ja/">日本語</a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
