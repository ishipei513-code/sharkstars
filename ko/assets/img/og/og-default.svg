<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="50%" stop-color="#F4F1EC"/>
      <stop offset="100%" stop-color="#F5DCC8"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8C5D6"/>
      <stop offset="100%" stop-color="#E8A598"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#A8C5D6" opacity="0.22"/>
  <circle cx="150" cy="510" r="140" fill="#C5D6C0" opacity="0.26"/>
  <circle cx="940" cy="520" r="60" fill="#E8A598" opacity="0.2"/>

  <!-- Main wordmark -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="140" font-weight="700" fill="#3A3D45" letter-spacing="-0.03em">KOJP</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="500" fill="#3A3D45" letter-spacing="-0.01em">한국 기업의 일본 시장 진출을,</text>
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="500" fill="#3A3D45" letter-spacing="-0.01em">AI 시대의 검색 전략으로.</text>

  <!-- Accent bar -->
  <rect x="100" y="460" width="120" height="4" fill="url(#og-accent)" rx="2"/>

  <!-- Service tags -->
  <text x="100" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="500" fill="#7B8088" letter-spacing="0.12em">
    SEO · AEO · GEO · LLMO · MEO · LOCALIZATION
  </text>

  <!-- Site URL -->
  <text x="100" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="400" fill="#A8ACB1" letter-spacing="0.04em">
    sharkstars.jp/ko/
  </text>
</svg>
