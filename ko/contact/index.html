<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 | KOJP — 한국 기업의 일본 시장 진출 지원</title>
  <meta name="description" content="KOJP에 문의하기. 한국어・일본어로 완벽하게 대응합니다. 이메일, 전화, 카카오톡/LINE으로 편하게 연락해 주세요.">

  <!-- Canonical & hreflang -->
  <link rel="canonical" href="https://sharkstars.jp/ko/contact/">
  <link rel="alternate" hreflang="ja-JP" href="https://sharkstars.jp/ko/ja/contact/">
  <link rel="alternate" hreflang="ko-KR" href="https://sharkstars.jp/ko/contact/">
  <link rel="alternate" hreflang="x-default" href="https://sharkstars.jp/ko/contact/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="문의하기 | KOJP">
  <meta property="og:description" content="한국어・일본어 모두 완벽하게 대응합니다. 편하게 연락해 주세요.">
  <meta property="og:url" content="https://sharkstars.jp/ko/contact/">
    <meta property="og:image" content="https://sharkstars.jp/ko/assets/img/hero/hero-main.jpg">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="1200">
  <meta name="twitter:image" content="https://sharkstars.jp/ko/assets/img/hero/hero-main.jpg">
<meta property="og:site_name" content="KOJP">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:locale:alternate" content="ja_JP">

  <!-- Pretendard Font -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard-jp/dist/web/static/pretendard-jp.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicons/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/img/favicons/favicon.svg">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/contact.css">

  <!-- Base path -->
  <meta data-base-path="../">

  <!-- JSON-LD: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "KOJP", "item": "https://sharkstars.jp/ko/" },
      { "@type": "ListItem", "position": 2, "name": "문의하기", "item": "https://sharkstars.jp/ko/contact/" }
    ]
  }
  </script>
</head>
<body>

  <a href="#main-content" class="skip-link">본문으로 건너뛰기</a>
<div id="header-placeholder"></div>

  <main id="main-content">

    <!-- Hero -->
    <section class="contact-hero" style="--contact-hero-bg: url('../assets/img/pages/contact-hero.jpg');">
      <div class="container text-center">
        <p class="contact-hero__label fade-up">Contact</p>
        <h1 class="contact-hero__title fade-up">편하게 문의해 주세요</h1>
        <p class="contact-hero__sub fade-up">한국어・일본어 모두 완벽하게 대응합니다.</p>
      </div>
    </section>


    <!-- Contact Methods (3 columns) -->
    <section class="section" id="methods">
      <div class="container">
        <div class="contact-methods grid grid-3">
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="mail" width="28" height="28"></i></div>
            <h2 class="contact-method__title">이메일</h2>
            <a href="mailto:contact@sharkstars.jp" class="contact-method__value">contact@sharkstars.jp</a>
            <p class="contact-method__note">24시간 이내 회신</p>
          </div>
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="phone" width="28" height="28"></i></div>
            <h2 class="contact-method__title">전화</h2>
            <a href="tel:+81501234567" class="contact-method__value">050-1234-5678</a>
            <p class="contact-method__note">평일 9:00-18:00 (KST)</p>
          </div>
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="message-circle" width="28" height="28"></i></div>
            <h2 class="contact-method__title">KakaoTalk / LINE</h2>
            <p class="contact-method__value">QR코드로 추가</p>
            <p class="contact-method__note">채팅으로 편하게 상담</p>
          </div>
        </div>
      </div>
    </section>


    <!-- Contact Form -->
    <section class="section section--alt" id="form">
      <div class="container">
        <div class="contact-form-wrapper">
          <div class="section__header fade-up" style="text-align:center; margin-bottom:var(--space-xl);">
            <h2 class="section__title">폼으로 문의하기</h2>
          </div>

          <form class="contact-form fade-up" id="contact-form" novalidate>

            <div class="form-group">
              <label for="c-name" class="form-label">이름 <span class="form-required">*</span></label>
              <input type="text" id="c-name" name="name" class="form-input" placeholder="예: 김지훈" required>
            </div>

            <div class="form-group">
              <label for="c-company" class="form-label">회사명</label>
              <input type="text" id="c-company" name="company" class="form-input" placeholder="예: OO주식회사">
            </div>

            <div class="form-group">
              <label for="c-email" class="form-label">이메일 주소 <span class="form-required">*</span></label>
              <input type="email" id="c-email" name="email" class="form-input" placeholder="예: contact@company.kr" required>
            </div>

            <div class="form-group">
              <label for="c-subject" class="form-label">제목</label>
              <select id="c-subject" name="subject" class="form-select">
                <option value="">선택해주세요</option>
                <option value="service">서비스에 대하여</option>
                <option value="pricing">요금에 대하여</option>
                <option value="other">기타</option>
              </select>
            </div>

            <div class="form-group">
              <label for="c-message" class="form-label">메시지 <span class="form-required">*</span></label>
              <textarea id="c-message" name="message" class="form-textarea" rows="5" placeholder="문의하실 내용을 작성해 주세요" required></textarea>
            </div>

            <div class="form-group">
              <label class="form-checkbox">
                <input type="checkbox" id="c-privacy" name="privacy" required>
                <span class="form-checkbox__mark"></span>
                <span class="form-checkbox__text"><a href="../legal/privacy/" target="_blank">개인정보처리방침</a>에 동의합니다 <span class="form-required">*</span></span>
              </label>
            </div>

            <div class="contact-form__submit">
              <button type="submit" class="btn btn--primary btn--lg">보내기</button>
            </div>
          </form>
        </div>
      </div>
    </section>


    <!-- Business Hours -->
    <section class="section" id="hours">
      <div class="container text-center">
        <div class="fade-up">
          <h2 class="section__title">영업시간</h2>
          <div class="business-hours">
            <div class="business-hours__item">
              <i aria-hidden="true" data-lucide="clock" width="20" height="20"></i>
              <span>평일 9:00 - 18:00 (JST / KST)</span>
            </div>
            <p class="business-hours__note">주말 및 공휴일은 이메일 접수만 가능 (다음 영업일에 회신)</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/javascript/components.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Contact form — mailto fallback until backend endpoint is live.
      const form = document.getElementById('contact-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = form.querySelector('#c-name').value.trim();
          const email = form.querySelector('#c-email').value.trim();
          const company = form.querySelector('#c-company')?.value.trim() || '';
          const message = form.querySelector('#c-message').value.trim();
          const privacy = form.querySelector('#c-privacy').checked;

          if (!name || !email || !message || !privacy) {
            alert('필수 항목을 입력해 주세요.');
            return;
          }

          const subject = encodeURIComponent(`[KOJP 문의] ${name}${company ? ' / ' + company : ''}`);
          const body = encodeURIComponent(
            `이름: ${name}\n이메일: ${email}\n회사: ${company || '(미기재)'}\n\n--- 문의 내용 ---\n${message}\n\n---\n개인정보처리방침에 동의함: 네`
          );
          window.location.href = `mailto:contact@sharkstars.jp?subject=${subject}&body=${body}`;
        });
      }
    });
  </script>
</body>
</html>
