<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | KOJP — 韓国企業の日本市場進出支援</title>
  <meta name="description" content="KOJPへのお問い合わせ。韓国語・日本語で対応。メール・電話・LINE/KakaoTalkでお気軽にご連絡ください。">

  <link rel="canonical" href="https://sharkstars.jp/ko/ja/contact/">
  <link rel="alternate" hreflang="ja-JP" href="https://sharkstars.jp/ko/ja/contact/">
  <link rel="alternate" hreflang="ko-KR" href="https://sharkstars.jp/ko/contact/">
  <link rel="alternate" hreflang="x-default" href="https://sharkstars.jp/ko/contact/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="お問い合わせ | KOJP">
  <meta property="og:description" content="韓国語・日本語で対応。お気軽にご連絡ください。">
  <meta property="og:url" content="https://sharkstars.jp/ko/ja/contact/">
    <meta property="og:image" content="https://sharkstars.jp/ko/assets/img/hero/hero-main.jpg">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="1200">
  <meta name="twitter:image" content="https://sharkstars.jp/ko/assets/img/hero/hero-main.jpg">
<meta property="og:site_name" content="KOJP">
  <meta property="og:locale" content="ja_JP">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard-jp/dist/web/static/pretendard-jp.min.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/pages/contact.css">
  <meta data-base-path="../">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "KOJP", "item": "https://sharkstars.jp/ko/ja/" },
      { "@type": "ListItem", "position": 2, "name": "お問い合わせ", "item": "https://sharkstars.jp/ko/ja/contact/" }
    ]
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicons/favicon.svg">
  <link rel="apple-touch-icon" href="../../assets/img/favicons/favicon.svg">
</head>
<body>

  <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
<div id="header-placeholder"></div>

  <main id="main-content">

    <!-- Hero -->
    <section class="contact-hero" style="--contact-hero-bg: url('../../assets/img/pages/contact-hero.jpg');">
      <div class="container text-center">
        <p class="contact-hero__label fade-up">Contact</p>
        <h1 class="contact-hero__title fade-up">お気軽にお問い合わせください</h1>
        <p class="contact-hero__sub fade-up">韓国語・日本語、どちらでも対応いたします。</p>
      </div>
    </section>


    <!-- Contact Methods (3 columns) -->
    <section class="section" id="methods">
      <div class="container">
        <div class="contact-methods grid grid-3">
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="mail" width="28" height="28"></i></div>
            <h2 class="contact-method__title">メール</h2>
            <a href="mailto:contact@sharkstars.jp" class="contact-method__value">contact@sharkstars.jp</a>
            <p class="contact-method__note">24時間以内に返信</p>
          </div>
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="phone" width="28" height="28"></i></div>
            <h2 class="contact-method__title">電話</h2>
            <a href="tel:+81501234567" class="contact-method__value">050-1234-5678</a>
            <p class="contact-method__note">平日 9:00-18:00 (JST)</p>
          </div>
          <div class="contact-method fade-up">
            <div class="contact-method__icon"><i aria-hidden="true" data-lucide="message-circle" width="28" height="28"></i></div>
            <h2 class="contact-method__title">LINE / KakaoTalk</h2>
            <p class="contact-method__value">QRコードで追加</p>
            <p class="contact-method__note">チャットで気軽に相談</p>
          </div>
        </div>
      </div>
    </section>


    <!-- Contact Form -->
    <section class="section section--alt" id="form">
      <div class="container">
        <div class="contact-form-wrapper">
          <div class="section__header fade-up" style="text-align:center; margin-bottom:var(--space-xl);">
            <h2 class="section__title">フォームで問い合わせ</h2>
          </div>

          <form class="contact-form fade-up" id="contact-form" novalidate>

            <div class="form-group">
              <label for="c-name" class="form-label">お名前 <span class="form-required">*</span></label>
              <input type="text" id="c-name" name="name" class="form-input" placeholder="例：김 지훈" required>
            </div>

            <div class="form-group">
              <label for="c-company" class="form-label">会社名</label>
              <input type="text" id="c-company" name="company" class="form-input" placeholder="例：○○株式会社">
            </div>

            <div class="form-group">
              <label for="c-email" class="form-label">メールアドレス <span class="form-required">*</span></label>
              <input type="email" id="c-email" name="email" class="form-input" placeholder="例：contact@company.kr" required>
            </div>

            <div class="form-group">
              <label for="c-subject" class="form-label">件名</label>
              <select id="c-subject" name="subject" class="form-select">
                <option value="">選択してください</option>
                <option value="service">サービスについて</option>
                <option value="pricing">料金について</option>
                <option value="other">その他</option>
              </select>
            </div>

            <div class="form-group">
              <label for="c-message" class="form-label">メッセージ <span class="form-required">*</span></label>
              <textarea id="c-message" name="message" class="form-textarea" rows="5" placeholder="お問い合わせ内容をご記入ください" required></textarea>
            </div>

            <div class="form-group">
              <label class="form-checkbox">
                <input type="checkbox" id="c-privacy" name="privacy" required>
                <span class="form-checkbox__mark"></span>
                <span class="form-checkbox__text"><a href="../legal/privacy/" target="_blank">プライバシーポリシー</a>に同意する <span class="form-required">*</span></span>
              </label>
            </div>

            <div class="contact-form__submit">
              <button type="submit" class="btn btn--primary btn--lg">送信する</button>
            </div>
          </form>
        </div>
      </div>
    </section>


    <!-- Business Hours -->
    <section class="section" id="hours">
      <div class="container text-center">
        <div class="fade-up">
          <h2 class="section__title">営業時間</h2>
          <div class="business-hours">
            <div class="business-hours__item">
              <i aria-hidden="true" data-lucide="clock" width="20" height="20"></i>
              <span>平日 9:00 - 18:00 (JST / KST)</span>
            </div>
            <p class="business-hours__note">土日祝日はメールのみ受付（翌営業日に返信）</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="../../assets/javascript/components.js"></script>
  <script src="../../assets/javascript/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Contact form — mailto fallback until backend endpoint is live.
      const form = document.getElementById('contact-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = form.querySelector('#c-name').value.trim();
          const email = form.querySelector('#c-email').value.trim();
          const company = form.querySelector('#c-company')?.value.trim() || '';
          const message = form.querySelector('#c-message').value.trim();
          const privacy = form.querySelector('#c-privacy').checked;

          if (!name || !email || !message || !privacy) {
            alert('必須項目を入力してください。');
            return;
          }
          const subject = encodeURIComponent(`[KOJP お問い合わせ] ${name}${company ? ' / ' + company : ''}`);
          const body = encodeURIComponent(
            `お名前: ${name}\nメール: ${email}\n会社名: ${company || '(未記入)'}\n\n--- お問い合わせ内容 ---\n${message}\n\n---\nプライバシーポリシーに同意: はい`
          );
          window.location.href = `mailto:contact@sharkstars.jp?subject=${subject}&body=${body}`;
        });
      }
    });
  </script>
</body>
</html>
